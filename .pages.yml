media:
  input: assets/uploads
  output: /assets/uploads
  categories: [image]
  extensions: [png, jpg, jpeg, webp, gif]
content:
  - name: site-content
    label: 홈페이지 콘텐츠
    type: file
    path: data/site-content.json
    format: json
    fields:
      - name: hero
        label: 첫 화면
        type: object
        fields:
          - name: eyebrow
            label: 상단 모집 문구
            type: string
          - name: titleLine1
            label: 큰 제목 첫째 줄
            type: string
          - name: titleLine2
            label: 큰 제목 둘째 줄
            type: string
          - name: description
            label: 소개 문구
            type: text
          - name: quickInfo
            label: 핵심 특징
            type: string
            list: true
      - name: classes
        label: 수업 안내 카드
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: icon
            label: 아이콘
            type: string
          - name: title
            label: 제목
            type: string
          - name: description
            label: 설명
            type: text
          - name: tag
            label: 대상 안내
            type: string
      - name: process
        label: 수업 시작 과정
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: 단계 제목
            type: string
          - name: description
            label: 안내 문구
            type: text
      - name: benefit
        label: 등록 혜택
        type: object
        fields:
          - name: label
            label: 혜택 상단 문구
            type: string
          - name: title
            label: 혜택 제목
            type: string
          - name: description
            label: 혜택 설명
            type: text
          - name: discounts
            label: 할인 문구
            type: string
            list: true
      - name: promise
        label: 상담 안내
        type: object
        fields:
          - name: title
            label: 제목
            type: string
          - name: description
            label: 설명
            type: text
      - name: faq
        label: 자주 묻는 질문
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{question}"
        fields:
          - name: question
            label: 질문
            type: string
          - name: answer
            label: 답변
            type: text
      - name: branches
        label: 지점 안내
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - name: name
            label: 지점명
            type: string
          - name: address
            label: 주소 안내
            type: string
          - name: phone
            label: 전화번호
            type: string
          - name: mapUrl
            label: 지도 링크
            type: string
